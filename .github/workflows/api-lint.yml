name: API lint

on:
  push:
    branches: [main]
    paths:
      - docs/openapi.yaml
      - .spectral.yaml
      - .github/workflows/api-lint.yml
  pull_request:
    paths:
      - docs/openapi.yaml
      - .spectral.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spectral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint the OpenAPI spec against our API standards
        run: npx --yes @stoplight/spectral-cli@6.17.0 lint docs/openapi.yaml --fail-severity=error
